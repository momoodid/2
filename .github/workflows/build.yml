name: Build OpenWrt AP8221

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python2.7 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler g++-multilib antlr3 gperf

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          rm -f .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_ap8221=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_ntfs-3g=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-ch341=y
          CONFIG_PACKAGE_kmod-usb-serial-cp210x=y
          CONFIG_PACKAGE_kmod-usb-serial-ftdi=y
          CONFIG_PACKAGE_kmod-usb-serial-pl2303=y
          CONFIG_PACKAGE_luci-app-adblock=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          # CONFIG_PACKAGE_kmod-mt7615e is not set
          # CONFIG_PACKAGE_kmod-mt7615-firmware is not set
          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_wifi-l1profile=y
          CONFIG_PACKAGE_uci2dat=y
          CONFIG_PACKAGE_wificonf=y
          CONFIG_PACKAGE_wireless-tools=y

          CONFIG_PACKAGE_wpad=y
          CONFIG_PACKAGE_hostapd-utils=y
          
          CONFIG_MTK_SUPPORT_OPENWRT=y
          CONFIG_MTK_WIFI_DRIVER=y
          CONFIG_MTK_FIRST_IF_MT7615E=y
          CONFIG_MTK_SECOND_IF_NONE=y
          CONFIG_MTK_THIRD_IF_NONE=y
          CONFIG_MTK_RT_FIRST_CARD=7615
          CONFIG_MTK_MT_WIFI=y
          CONFIG_MTK_MT_WIFI_PATH="mt_wifi"
          CONFIG_MTK_FIRST_IF_EEPROM_FLASH=y
          CONFIG_MTK_DBDC_MODE=y
          CONFIG_first_card=y
          CONFIG_first_card_name="MT7615"
          CONFIG_first_card_profile_path="/etc/wireless/mt7615/mt7615.1.2G.dat;/etc/wireless/mt7615/mt7615.1.5G.dat"
          CONFIG_first_card_init_script="/lib/wifi/mt7615.lua"
          CONFIG_first_card_init_compatible="mt7615"
          CONFIG_first_card_EEPROM_offset="0x0"
          CONFIG_first_card_EEPROM_size="0x4000"
          CONFIG_first_card_EEPROM_name="e2p"
          CONFIG_first_card_main_ifname="ra0;rax0"
          CONFIG_first_card_ext_ifname="ra;rax"
          CONFIG_first_card_wds_ifname="wds;wdsx"
          CONFIG_first_card_apcli_ifname="apcli;apclix"
          CONFIG_first_card_mesh_ifname="mesh;meshx"
          CONFIG_first_card_nvram_zone="RT2860;RT2860"
          CONFIG_first_card_single_sku_path="/etc/wireless/mt7615/mt7615-sku.dat"
          CONFIG_first_card_bf_sku_path="/etc/wireless/mt7615/mt7615-sku-bf.dat"
          # CONFIG_second_card is not set
          # CONFIG_third_card is not set
          CONFIG_PACKAGE_mtk-luci-plugin=y
          CONFIG_LUCI_APP_MTKWIFI=y
          CONFIG_PACKAGE_mtk-nvram=y
          CONFIG_PACKAGE_uci2dat=y
          CONFIG_PACKAGE_wificonf=y
          CONFIG_PACKAGE_wireless-tools=y
          CONFIG_MTK_WIFI_MODE_AP=y
          CONFIG_MTK_APCLI_SUPPORT=y
          CONFIG_MTK_MBSS_SUPPORT=y
          CONFIG_MTK_WDS_SUPPORT=y
          CONFIG_MTK_WSC_INCLUDED=y
          CONFIG_MTK_WSC_V2_SUPPORT=y
          CONFIG_MTK_DOT11W_PMF_SUPPORT=y
          CONFIG_MTK_TXBF_SUPPORT=y
          CONFIG_MTK_IGMP_SNOOP_SUPPORT=y
          CONFIG_MTK_RTMP_FLASH_SUPPORT=y
          CONFIG_MTK_PRE_CAL_TRX_SET1_SUPPORT=y
          CONFIG_MTK_RLM_CAL_CACHE_SUPPORT=y
          CONFIG_MTK_PRE_CAL_TRX_SET2_SUPPORT=y
          CONFIG_MTK_ATE_SUPPORT=y
          CONFIG_MTK_UAPSD=y
          CONFIG_MTK_TCP_RACK_SUPPORT=y
          CONFIG_MTK_RED_SUPPORT=y
          CONFIG_MTK_MCAST_RATE_SPECIFIC=y
          CONFIG_MTK_VOW_SUPPORT=y
          CONFIG_MTK_BAND_STEERING=y
          CONFIG_MTK_GREENAP_SUPPORT=y
          CONFIG_MTK_PCIE_ASPM_DYM_CTRL_SUPPORT=y
          CONFIG_MTK_MUMIMO_SUPPORT=y
          CONFIG_MTK_MU_RA_SUPPORT=y
          CONFIG_MTK_MAC_REPEATER_SUPPORT=y
          CONFIG_MTK_WIFI_MT_MAC=y
          CONFIG_MTK_MT_MAC=y
          CONFIG_MTK_CHIP_MT7615E=y
          EOF
          make defconfig

      - name: Verify config
        run: |
          set -eu

          echo "===== 检查闭源驱动关键项 ====="
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_ap8221=y$' .config || {
            echo "❌ ap8221 没被选中"
            exit 1
          }

          grep -q '^CONFIG_PACKAGE_kmod-mt_wifi=y$' .config || {
            echo "❌ 闭源驱动 kmod-mt_wifi 没被选中"
            exit 1
          }

          grep -q '^CONFIG_PACKAGE_wifi-l1profile=y$' .config || {
            echo "❌ wifi-l1profile 没被选中"
            exit 1
          }

          echo "✅ MTK 闭源驱动关键项正常"

          echo "===== 检查开源 mt7615 是否被误选 ====="
          if grep -q '^CONFIG_PACKAGE_kmod-mt7615e=y$' .config; then
            echo "❌ 开源 mt7615e 被选中"
            exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_kmod-mt7615-firmware=y$' .config; then
            echo "❌ 开源 mt7615 固件被选中"
            exit 1
          fi

          echo "✅ 开源 mt7615e 及其固件已禁用"

          echo "===== 检查 EEPROM 和 profile ====="
          grep -q '^CONFIG_first_card_EEPROM_offset=' .config || {
            echo "❌ EEPROM offset 没配置"
            exit 1
          }

          grep -q '^CONFIG_first_card_EEPROM_size=' .config || {
            echo "❌ EEPROM size 没配置"
            exit 1
          }

          grep -q '^CONFIG_first_card_profile_path=' .config || {
            echo "❌ profile path 没配置"
            exit 1
          }

          grep -q '^CONFIG_MTK_DBDC_MODE=y$' .config || {
            echo "❌ DBDC 模式没开"
            exit 1
          }

          grep -q '^CONFIG_MTK_APCLI_SUPPORT=y$' .config || {
            echo "❌ APCLI 没开"
            exit 1
          }

          echo "===== 检查设备选择 ====="
          if grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_netgear_r6350=y$' .config; then
            echo "❌ 选成 R6350 了"
            exit 1
          fi

          echo "✅ 设备选择正常"

          echo "===== 检查 hostapd ====="
          grep -q '^CONFIG_PACKAGE_wpad=y$' .config || {
            echo "❌ wpad 没有生效"
            exit 1
          }

          grep -q '^CONFIG_PACKAGE_hostapd-utils=y$' .config || {
            echo "❌ hostapd-utils 没有生效"
            exit 1
          }

          if grep -Eq '^CONFIG_PACKAGE_(hostapd|hostapd-basic|hostapd-mini|wpad-basic|wpad-mini)=y$' .config; then
            echo "❌ 选中了与 wpad 冲突的 hostapd/wpad 变体："
            grep -E '^CONFIG_PACKAGE_(hostapd|hostapd-basic|hostapd-mini|wpad|wpad-basic|wpad-mini)=' .config
            exit 1
          fi

          echo "✅ hostapd 配置正常"

          echo "===== 检查源文件 ====="
          test -x files/sbin/wifi || {
            echo "❌ files/sbin/wifi 不存在或没有执行权限"
            exit 1
          }

          test -x files/sbin/hostapd_loader.sh || {
            echo "❌ files/sbin/hostapd_loader.sh 不存在或没有执行权限"
            exit 1
          }

          test -x files/etc/init.d/hostapd || {
            echo "❌ files/etc/init.d/hostapd 不存在或没有执行权限"
            exit 1
          }

          echo "✅ 无线启动脚本检查正常"

      - name: Download
        run: make download -j8
      - name: Download
        run: make download -j8

      - name: Build
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ap8221
          path: |
            bin/targets/ramips/mt7621/*ap8221*squashfs-sysupgrade.bin
            bin/targets/ramips/mt7621/*ap8221*initramfs-kernel.bin
